name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: "Direct URL to your mod .zip file"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: ShadowMario/FNF-PsychEngine
          path: engine-source

      - name: Download Mod Payload
        run: |
          echo "Downloading mod from URL provided..."
          pip install gdown --quiet

          URL="${{ github.event.inputs.mod_url }}"

          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod-payload.zip
          else
            wget -q -O mod-payload.zip "$URL"
          fi

          echo "Extracting Mod Payload..."
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/
          rm mod-payload.zip

      - name: Inject Mods into Engine
        run: |
          cd engine-source
          mkdir -p mods

          cp -rn ../mods_upload/* mods/ || true
          cp -rn ../mods_upload/* assets/ || true

      - name: Disable Videos for Web Compatibility
        run: |
          cd engine-source
          find . -name "*.mp4" -type f -exec mv {} {}.disabled \;

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelibs and Dependencies
        run: |
          cd engine-source
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          chmod +x setup/unix.sh
          bash setup/unix.sh

      - name: Patch HTML5 Incompatible Code
        run: |
          cd engine-source

          # Disable native-only systems on HTML5
          sed -i 's#<define name="DISCORD_ALLOWED" />#<define name="DISCORD_ALLOWED" unless="html5" />#' Project.xml || true
          sed -i 's#<define name="MULTITHREADED_LOADING" />#<define name="MULTITHREADED_LOADING" unless="html5" />#' Project.xml || true

          mkdir -p source/webcompat

          cat > source/webcompat/WebFileSystem.hx <<'EOF'
          package webcompat;

          class WebFileSystem {
            public static function absolutePath(path:String):String {
              return path;
            }

            public static function exists(path:String):Bool {
              return false;
            }

            public static function readDirectory(path:String):Array<String> {
              return [];
            }

            public static function isDirectory(path:String):Bool {
              return false;
            }

            public static function stat(path:String):Dynamic {
              return null;
            }

            public static function fullPath(path:String):String {
              return path;
            }

            public static function createDirectory(path:String):Void {}

            public static function deleteFile(path:String):Void {}

            public static function deleteDirectory(path:String):Void {}
          }
          EOF

          cat > source/webcompat/WebFile.hx <<'EOF'
          package webcompat;

          class WebFile {
            public static function getContent(path:String):String {
              return "";
            }

            public static function getBytes(path:String):haxe.io.Bytes {
              return null;
            }

            public static function saveContent(path:String, content:String):Void {}

            public static function saveBytes(path:String, bytes:haxe.io.Bytes):Void {}

            public static function copy(source:String, destination:String):Void {}
          }
          EOF

          cat > source/webcompat/WebProcess.hx <<'EOF'
          package webcompat;

          class WebProcess {
            public var stdout:Dynamic;
            public var stderr:Dynamic;

            public function new(command:String, ?args:Dynamic) {
              stdout = {
                readAll: function() {
                  return {
                    toString: function() return ""
                  };
                },
                readLine: function() return ""
              };

              stderr = stdout;
            }

            public function exitCode(block:Bool = true):Int {
              return 0;
            }

            public function close():Void {}
          }
          EOF

          cat > source/webcompat/WebThread.hx <<'EOF'
          package webcompat;

          class WebThread {
            public static function create(func:Void->Void):WebThread {
              func();
              return new WebThread();
            }

            public function new() {}

            public static function readMessage(block:Bool):Dynamic {
              return null;
            }

            public function sendMessage(message:Dynamic):Void {}
          }
          EOF

          cat > source/webcompat/WebMutex.hx <<'EOF'
          package webcompat;

          class WebMutex {
            public function new() {}

            public function acquire():Void {}

            public function release():Void {}
          }
          EOF

          cat > source/webcompat/WebFixedThreadPool.hx <<'EOF'
          package webcompat;

          class WebFixedThreadPool {
            public function new(count:Int) {}

            public function run(func:Void->Void):Void {
              func();
            }

            public function shutdown():Void {}
          }
          EOF

          # Replace desktop imports with HTML5-safe aliases.
          find source -name "*.hx" -type f -exec sed -i \
            -e 's#import sys\.FileSystem;#import webcompat.WebFileSystem as FileSystem;#g' \
            -e 's#import sys\.io\.File;#import webcompat.WebFile as File;#g' \
            -e 's#import sys\.io\.Process;#import webcompat.WebProcess as Process;#g' \
            -e 's#import sys\.thread\.Thread;#import webcompat.WebThread as Thread;#g' \
            -e 's#import sys\.thread\.Mutex;#import webcompat.WebMutex as Mutex;#g' \
            -e 's#import sys\.thread\.FixedThreadPool;#import webcompat.WebFixedThreadPool as FixedThreadPool;#g' \
            {} +

          # Replace fully-qualified references too.
          find source -name "*.hx" -type f -exec sed -i \
            -e 's#sys\.FileSystem#webcompat.WebFileSystem#g' \
            -e 's#sys\.io\.File#webcompat.WebFile#g' \
            -e 's#sys\.io\.Process#webcompat.WebProcess#g' \
            -e 's#sys\.thread\.Thread#webcompat.WebThread#g' \
            -e 's#sys\.thread\.Mutex#webcompat.WebMutex#g' \
            -e 's#sys\.thread\.FixedThreadPool#webcompat.WebFixedThreadPool#g' \
            {} +

          # Browser target has no FlxG.error()
          find source -name "*.hx" -type f -exec sed -i \
            's/FlxG\.error(/FlxG.log.error(/g' \
            {} +

          # Disable C++ memory reporting in browser.
          sed -i \
            's/return Dynamic\.Gc\.memInfo64(Dynamic\.Gc\.MEM_INFO_USAGE);/return 0;/g' \
            source/debug/FPSCounter.hx || true

          # Remove direct cpp imports from HTML5 compilation.
          find source -name "*.hx" -type f -exec sed -i \
            -e '/^import cpp\./d' \
            -e '/^import llua\./d' \
            {} +

          echo "HTML5 compatibility patches applied."

      - name: Build HTML5
        run: |
          cd engine-source
          haxelib run lime build html5 -release -D NO_PRELOAD_ALL

      - name: Package Web Export
        run: |
          cd engine-source/export/release/html5/bin

          MAIN_JS=$(ls *.js | grep -E -v 'howler|pako' | head -n 1 || true)

          if [ -n "$MAIN_JS" ] && [ "$MAIN_JS" != "funkin.js" ]; then
            mv "$MAIN_JS" funkin.js

            if [ -f "index.html" ]; then
              sed -i "s/$MAIN_JS/funkin.js/g" index.html
            fi
          fi

          if [ ! -f "index.html" ]; then
            echo "<!DOCTYPE html><html><body><h1>FNF Web Build</h1><script src='funkin.js'></script></body></html>" > index.html
          fi

          zip -r ../../../../../web_export.zip *

      - name: Upload Web Export
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: engine-source/web_export.zip

      - name: Auto-Publish to web-build Branch
        run: |
          cd engine-source/export/release/html5/bin

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Automated Web Port Build"

          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:web-build
